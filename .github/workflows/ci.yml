name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31.11.1

      - name: formatting
        run: |
          rev=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          nix run "github:nixos/nixpkgs/${rev}#alejandra" -- --check .

      - name: agecrypt
        run: bash ci/check-agecrypt.sh

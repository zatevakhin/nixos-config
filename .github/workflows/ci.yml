name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31.11.1

      - name: formatting
        run: |
          rev=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          nix shell "github:nixos/nixpkgs/${rev}#just" "github:nixos/nixpkgs/${rev}#alejandra" -c just fmt-check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - name: secrets
        run: just check-secrets
